<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F8FA" />
    <script>
      (function () {
        try {
          var p = localStorage.getItem('theme');
          var dark =
            p === 'dark' ||
            ((p !== 'light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#0B0D12' : '#F7F8FA');
        } catch (e) {}
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" sizes="any" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Tasks — Write it down. It's handled.</title>
    <meta
      name="description"
      content="The calmest way to capture todos. Break big ones into small steps, check them off, and watch them disappear. Free, private, synced."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Tasks" />
    <meta property="og:title" content="Tasks — Write it down. It's handled." />

  </head>

  </body>
</html>
